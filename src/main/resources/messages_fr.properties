# encoding=UTF-8
# Camera lifecycle
CAM_RECONNECTING=Caméra "{0}" : Tentative de reconnexion (tentative #{1})...
CAM_CONNECTED=Caméra "{0}" : Connectée avec succès et en diffusion
CAM_HIBERNATING=Caméra "{0}" : Passage en mode veille pendant 5 minutes après {1} tentatives de connexion échouées. Nouvelle tentative automatique.
CAM_HIBERNATE_COMPLETE=Caméra "{0}" : Veille terminée. Reprise des tentatives de connexion...

# Detection notifications
DETECTION_HEADER=Caméra : {0}
DETECTION_BEST_MATCH=Meilleure Distance de Correspondance : {0}
DETECTION_FRAMES_IDENTIFIED=Frames Où la Personne a Été Identifiée : {0}
DETECTION_FRAMES_TRACKED=Total de Frames Suivis : {0}
DETECTION_KNOWN={0} connue(s) ({1})
DETECTION_UNKNOWN={0} personne(s) inconnue(s)
DETECTION_NONE=Aucune personne détectée
DETECTION_TIME=Heure : {0}

# GIF notification
GIF_HEADER=Animation de Suivi
GIF_CAMERA=Caméra : {0}
GIF_FRAMES=Frames : {0}
GIF_DURATION=Durée : ~{0} secondes
