# encoding=UTF-8
# Camera lifecycle
CAM_RECONNECTING=Cámara "{0}": Intentando reconectar (intento #{1})...
CAM_CONNECTED=Cámara "{0}": Conectada exitosamente y transmitiendo
CAM_HIBERNATING=Cámara "{0}": Entrando en modo de hibernación por 5 minutos después de {1} intentos de conexión fallidos. Reintentará automáticamente.
CAM_HIBERNATE_COMPLETE=Cámara "{0}": Hibernación completa. Reanudando intentos de conexión...

# Detection notifications
DETECTION_HEADER=Cámara: {0}
DETECTION_BEST_MATCH=Mejor Distancia de Coincidencia: {0}
DETECTION_FRAMES_IDENTIFIED=Frames Donde la Persona Fue Identificada: {0}
DETECTION_FRAMES_TRACKED=Total de Frames Rastreados: {0}
DETECTION_KNOWN={0} conocida(s) ({1})
DETECTION_UNKNOWN={0} persona(s) desconocida(s)
DETECTION_NONE=Ninguna persona detectada
DETECTION_TIME=Hora: {0}

# GIF notification
GIF_HEADER=Animación de Rastreo
GIF_CAMERA=Cámara: {0}
GIF_FRAMES=Frames: {0}
GIF_DURATION=Duración: ~{0} segundos
