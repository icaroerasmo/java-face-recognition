# encoding=UTF-8
# Camera lifecycle
CAM_RECONNECTING=🔄 Câmera "{0}": Tentando reconectar (tentativa #{1})...
CAM_CONNECTED=✅ Câmera "{0}": Conectada com sucesso e transmitindo
CAM_HIBERNATING=💤 Câmera "{0}": Entrando em modo de hibernação por 5 minutos após {1} tentativas de conexão falharem. Tentará novamente automaticamente.
CAM_HIBERNATE_COMPLETE=⚡ Câmera "{0}": Hibernação completa. Retomando tentativas de conexão...

# Detection notifications
DETECTION_HEADER=Câmera: {0}
DETECTION_BEST_MATCH=Melhor Distância de Correspondência: {0}
DETECTION_FRAMES_IDENTIFIED=Frames Onde a Pessoa Foi Identificada: {0}
DETECTION_FRAMES_TRACKED=Total de Frames Rastreados: {0}
DETECTION_KNOWN={0} conhecida(s) ({1})
DETECTION_UNKNOWN={0} pessoa(s) desconhecida(s)
DETECTION_NONE=Nenhuma pessoa detectada
DETECTION_TIME=Hora: {0}

# GIF notification
GIF_HEADER=📹 Animação de Rastreamento
GIF_CAMERA=📷 Câmera: {0}
GIF_FRAMES=🎞️ Frames: {0}
GIF_DURATION=⏱️ Duração: ~{0} segundos
