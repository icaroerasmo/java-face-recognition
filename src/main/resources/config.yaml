object-detection:
  locale: 'pt-BR'
  streams:
    processing-fps: 5
    frame-queue-capacity: 2
    tracking-max-frames: 30
    max-consecutive-null-frames: 300
    cameras:
      - name: "backyard"
        url: "rtsp://localhost:8554/backyard?video&audio"
      # - name: "front-door"
      #   url: "rtsp://another-camera/stream"
  training:
    root-folder: "train"
  acceleration:
    backend: OPENCV
    target: CPU
    face-detection-target: OPENCL
    person-detection-target: CPU
    enable-opencl: true
    fallback-to-cpu: true
  detection:
    person-confidence-threshold: 0.8
    car-confidence-threshold: 0.5
    max-person-area-ratio: 0.45
    movement:
      enabled: true
      notify-telegram: true
      difference-threshold: 25
      min-motion-ratio: 0.01
      debounce-ms: 5000
      telegram-throttle-ms: 30000
      processing-width: 320
      gaussian-kernel-size: 5
      dilation-iterations: 2
    pet:
      enabled: true
      confidence-threshold: 0.5
      plant-confidence-threshold: 0.5
      plant-suppression-iou: 0.35
      debounce-ms: 5000
      telegram-throttle-ms: 30000
  telegram:
    # Animation FPS for Telegram tracking clips (higher = smoother, larger/heavier files)
    gif-fps: 10
    # Maximum number of frame images retained per tracked person for Telegram clips
    gif-max-frames: 30

spring:
  rabbitmq:
    host: '${RABBITMQ_HOST:localhost}'
    port: ${RABBITMQ_PORT:5672}
    username: '${RABBITMQ_USERNAME:guest}'
    password: '${RABBITMQ_PASSWORD:guest}'
    publisher-confirm-type: correlated
    publisher-returns: true
