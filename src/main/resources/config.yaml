face-recognition:
  streams:
    cameras:
      - name: "backyard"
        url: "rtsp://localhost:8554/backyard?video&audio"
      # - name: "front-door"
      #   url: "rtsp://another-camera/stream"
  training:
    dataset-path: "trained_dataset.xml"
    root-folder: "train"
  telegram:
    # Bot token from Telegram BotFather - set this in config/config.yaml or environment variable
    bot-token: "${TELEGRAM_BOT_TOKEN:}"
    # Telegram chat ID to receive notifications - set this in config/config.yaml or environment variable
    chat-id: "${TELEGRAM_CHAT_ID:}"
