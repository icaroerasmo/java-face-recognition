object-detection:
  locale: 'pt-BR'
  streams:
    processing-fps: 5
    frame-queue-capacity: 2
    tracking-max-frames: 30
    max-consecutive-null-frames: 300
    cameras:
      - name: "backyard"
        url: "rtsp://localhost:8554/backyard?video&audio"
      # - name: "front-door"
      #   url: "rtsp://another-camera/stream"
  training:
    root-folder: "train"
  acceleration:
    # Inference backend. AUTO detects the best available at startup
    # (CUDA > OpenCL > Vulkan > CPU for OpenCV DNN). Other options:
    # OPENCV (CPU), CUDA, OPENCL, VULKAN, ONNX_CPU, ONNX_CUDA, ONNX_ROCM.
    # Overridable at runtime via OBJECT_DETECTION_ACCELERATION_BACKEND env var
    # (e.g. in the compose file: ACCELERATION_BACKEND=OPENCL).
    backend: AUTO
    target: AUTO
    face-detection-target: AUTO
    person-detection-target: AUTO
    enable-opencl: true
    fallback-to-cpu: true
  detection:
    person-confidence-threshold: 0.8
    car-confidence-threshold: 0.5
    max-person-area-ratio: 0.45
    notification-cooldown-ms: 30000
    movement:
      enabled: true
      notify: true
      difference-threshold: 25
      min-motion-ratio: 0.01
      debounce-ms: 5000
      throttle-ms: 30000
      processing-width: 320
      gaussian-kernel-size: 5
      dilation-iterations: 2
    pet:
      enabled: true
      confidence-threshold: 0.5
      plant-confidence-threshold: 0.5
      plant-suppression-iou: 0.35
      debounce-ms: 5000
      throttle-ms: 30000
  clips:
    # Animation FPS for tracking clips published to RabbitMQ (higher = smoother, larger/heavier files)
    gif-fps: 10
    # Maximum number of frame images retained per tracked person for clips
    gif-max-frames: 30

rabbitMq:
  host: '${RABBITMQ_HOST:localhost}'
  port: ${RABBITMQ_PORT:5672}
  username: '${RABBITMQ_USERNAME:guest}'
  password: '${RABBITMQ_PASSWORD:guest}'
  publisher-confirm-type: correlated
  publisher-returns: true
