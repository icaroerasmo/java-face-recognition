face-recognition:
  streams:
    processing-fps: 5
    frame-queue-capacity: 2
    tracking-max-frames: 30
    max-consecutive-null-frames: 300
    cameras:
      - name: "backyard"
        url: "rtsp://localhost:8554/backyard?video&audio"
      # - name: "front-door"
      #   url: "rtsp://another-camera/stream"
  training:
    root-folder: "train"
  acceleration:
    backend: OPENCV
    target: CPU
    face-detection-target: OPENCL
    person-detection-target: CPU
    enable-opencl: true
    fallback-to-cpu: true
  telegram:
    # Bot token from Telegram BotFather - set this in config/config.yaml or environment variable
    bot-token: "${TELEGRAM_BOT_TOKEN:}"
    # Telegram chat ID to receive notifications - set this in config/config.yaml or environment variable
    chat-id: "${TELEGRAM_CHAT_ID:}"
    # Animation FPS for Telegram tracking clips (higher = smoother, larger/heavier files)
    gif-fps: 10
    # Maximum number of frame images retained per tracked person for Telegram clips
    gif-max-frames: 30
