face-recognition:
  locale: 'pt-BR'
  streams:
    processing-fps: 5
    frame-queue-capacity: 2
    tracking-max-frames: 30
    max-consecutive-null-frames: 300
    cameras:
      - name: "backyard"
        url: "rtsp://localhost:8554/backyard?video&audio"
      # - name: "front-door"
      #   url: "rtsp://another-camera/stream"
  training:
    root-folder: "train"
  acceleration:
    backend: OPENCV
    target: CPU
    face-detection-target: OPENCL
    person-detection-target: CPU
    enable-opencl: true
    fallback-to-cpu: true
  detection:
    person-confidence-threshold: 0.8
  telegram:
    # Animation FPS for Telegram tracking clips (higher = smoother, larger/heavier files)
    gif-fps: 10
    # Maximum number of frame images retained per tracked person for Telegram clips
    gif-max-frames: 30

spring:
  rabbitmq:
    host: '${RABBITMQ_HOST:localhost}'
    port: ${RABBITMQ_PORT:5672}
    username: '${RABBITMQ_USERNAME:guest}'
    password: '${RABBITMQ_PASSWORD:guest}'
    publisher-confirm-type: correlated
    publisher-returns: true
