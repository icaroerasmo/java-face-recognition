# encoding=UTF-8
# Camera lifecycle
CAM_RECONNECTING=Telecamera "{0}": Tentativo di riconnessione (tentativo #{1})...
CAM_CONNECTED=Telecamera "{0}": Connessa con successo e in streaming
CAM_HIBERNATING=Telecamera "{0}": Entrata in modalità di risparmio energetico per 5 minuti dopo {1} tentativi di connessione falliti. Riproverà automaticamente.
CAM_HIBERNATE_COMPLETE=Telecamera "{0}": Risparmio energetico completato. Ripresa dei tentativi di connessione...

# Detection notifications
DETECTION_HEADER=Telecamera: {0}
DETECTION_BEST_MATCH=Migliore Distanza di Corrispondenza: {0}
DETECTION_FRAMES_IDENTIFIED=Frame Dove la Persona è Stata Identificata: {0}
DETECTION_FRAMES_TRACKED=Totale Frame Tracciati: {0}
DETECTION_KNOWN={0} conosciuta/e ({1})
DETECTION_UNKNOWN={0} persona/e sconosciuta/e
DETECTION_NONE=Nessuna persona rilevata
DETECTION_TIME=Ora: {0}

# GIF notification
GIF_HEADER=Animazione di Monitoraggio
GIF_CAMERA=Telecamera: {0}
GIF_FRAMES=Frame: {0}
