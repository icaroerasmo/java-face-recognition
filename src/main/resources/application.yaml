spring:
  datasource:
    url: "jdbc:sqlite:/app/data/face-recognition.db?busy_timeout=30000&journal_mode=WAL"
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-timeout: 30000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        # Explicitly set Hibernate dialect to the official SQLiteDialect
        dialect: org.hibernate.community.dialect.SQLiteDialect
        # Improve transaction handling
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  config:
    # Allow pointing to an external config folder via environment or system property
    # Example: -Dspring.config.additional-location=./config/
    # We keep user-editable configs (object-detection.*) in config.yaml there
    import: optional:config/ # will look for config/config.yaml by default

logging:
  level:
    root: INFO
    com.icaroerasmo: DEBUG
