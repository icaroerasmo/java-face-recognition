# encoding=UTF-8
# Camera lifecycle
CAM_RECONNECTING=Kamera "{0}": Versuche Verbindung wiederherzustellen (Versuch #{1})...
CAM_CONNECTED=Kamera "{0}": Erfolgreich verbunden und streaming
CAM_HIBERNATING=Kamera "{0}": Wechselt in den Ruhezustand für 5 Minuten nach {1} fehlgeschlagenen Verbindungsversuchen. Wird automatisch erneut versuchen.
CAM_HIBERNATE_COMPLETE=Kamera "{0}": Ruhezustand abgeschlossen. Setze Verbindungsversuche fort...

# Detection notifications
DETECTION_HEADER=Kamera: {0}
DETECTION_BEST_MATCH=Beste Übereinstimmungsdistanz: {0}
DETECTION_FRAMES_IDENTIFIED=Frames in denen die Person Identifiziert Wurde: {0}
DETECTION_FRAMES_TRACKED=Gesamtzahl der Verfolgten Frames: {0}
DETECTION_KNOWN={0} bekannt(e) ({1})
DETECTION_UNKNOWN={0} unbekannte Person(en)
DETECTION_NONE=Keine Personen erkannt
DETECTION_TIME=Zeit: {0}

# GIF notification
GIF_HEADER=Verfolgungsanimation
GIF_CAMERA=Kamera: {0}
GIF_FRAMES=Frames: {0}
GIF_DURATION=Dauer: ~{0} Sekunden
