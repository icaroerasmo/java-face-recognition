# encoding=UTF-8
# Camera lifecycle
CAM_RECONNECTING=🔄 Camera "{0}": Attempting to reconnect (attempt #{1})...
CAM_CONNECTED=✅ Camera "{0}": Connected successfully and streaming
CAM_HIBERNATING=💤 Camera "{0}": Entering hibernate mode for 5 minutes after {1} failed connection attempts. Will retry automatically.
CAM_HIBERNATE_COMPLETE=⚡ Camera "{0}": Hibernate complete. Resuming connection attempts...

