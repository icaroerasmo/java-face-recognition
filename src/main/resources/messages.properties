DETECTION_HEADER=Camera: {0}
DETECTION_BEST_MATCH=Best Match Distance: {0}
DETECTION_FRAMES_IDENTIFIED=Frames Where Person Was Identified: {0}
DETECTION_FRAMES_TRACKED=Total Frames Tracked: {0}
DETECTION_KNOWN={0} known ({1})
DETECTION_UNKNOWN={0} unknown people
DETECTION_NONE=No people detected
DETECTION_TIME=Time: {0}

# GIF notification
GIF_HEADER=📹 Tracking Animation
GIF_CAMERA=📷 Camera: {0}
GIF_FRAMES=🎞️ Frames: {0}
